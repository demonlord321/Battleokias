<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle'O'Kias</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Each screen is a <section class="screen">. The screen switcher shows one at a time. -->

  <section id="menu-screen" class="screen">
    <div class="menu-backdrop" aria-hidden="true">
      <div class="float-card c1"></div>
      <div class="float-card c2"></div>
      <div class="float-card c3"></div>
      <div class="float-card c4"></div>
      <div class="float-card c5"></div>
    </div>
    <div class="menu-content">
      <h1 class="title">Battle<span class="apos">'</span>O<span class="apos">'</span>Kias</h1>
      <p class="subtitle">A trading card game</p>
      <nav class="menu-buttons">
        <button id="new-game-btn" class="menu-btn">New Game</button>
        <button id="tutorial-btn" class="menu-btn">Tutorial</button>
        <!-- Load Game, Settings and Quit come later -->
      </nav>
    </div>
    <footer class="version">v0.1</footer>
  </section>

  <section id="game-screen" class="screen">
    <header class="game-bar">
      <button id="back-to-menu-btn" class="small-btn">&larr; Menu</button>
      <span class="game-bar-title">Battle'O'Kias</span>
      <span class="hint">Esc: back to menu</span>
    </header>
    <!-- The board is built by src/board/board.js from the layout in src/board/layout.js. -->
    <main id="board" class="board"></main>
  </section>

  <section id="tutorial-screen" class="screen">
    <header class="game-bar">
      <button id="tutorial-back-btn" class="small-btn">&larr; Menu</button>
      <span class="game-bar-title">Tutorial</span>
      <span class="hint">Esc: back to menu</span>
    </header>
    <!-- Guided tutorial match goes here (Milestone 2.5), steps from data/tutorial.json. -->
    <main class="tutorial-panel">
      <div class="tutorial-card">
        <h2>How to play</h2>
        <p>A guided match that teaches the rules one step at a time is on its way.</p>
        <p class="tutorial-soon">It will cover the resource, playing a card, attacking and ending your turn, then finish with a short free game.</p>
      </div>
    </main>
  </section>

  <script type="module" src="src/main.js"></script>
</body>
</html>
